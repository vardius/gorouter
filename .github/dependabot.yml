version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /examples/grpc
    schedule:
      interval: weekly
    # The router itself is replaced with the local copy, so its version here means nothing.
    ignore:
      - dependency-name: github.com/vardius/gorouter/v5
    groups:
      grpc-example:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ['*']
